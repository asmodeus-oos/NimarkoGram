name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK & CMake
      run: |
        sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :TMessagesProj_App:assembleAfatDebug :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NebulaGram-Afat-Debug-APK
        path: |
          TMessagesProj_App/build/outputs/apk/**/*.apk
          TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
        if-no-files-found: warn
